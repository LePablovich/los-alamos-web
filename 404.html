<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Official site of Los Alamos Interactive. Creators of Dunguns and upcoming indie games.">
    <meta property="og:title" content="Los Alamos Interactive - Indie Games">
    <meta property="og:description" content="Download Dunguns for free. Survival roguelike made in 12 days.">
    <meta property="og:image" content="https://losalamosinteractive.netlify.app/img/LosAlamos_Preview.png"> <meta property="og:url" content="https://losalamosinteractive.netlify.app/">
    <meta name="twitter:card" content="summary_large_image">
    <title>404 - Signal Lost | Los Alamos Interactive</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Importamos las mismas fuentes y estilos base para mantener la identidad */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

        :root {
            --color-primary: #4ade80;
            --color-bg: #0a0a0a;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-rajdhani { font-family: 'Rajdhani', sans-serif; }

        body {
            background-color: #0a0a0a;
            color: #e5e5e5;
            overflow: hidden; /* Evita scroll bars */
        }

        /* Fondo con ruido estático (simulado) */
        .bg-noise {
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.1;
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* Efecto Glitch para el 404 */
        .glitch-404 {
            position: relative;
            animation: glitch-skew 1s infinite linear alternate-reverse;
        }

        .glitch-404::before,
        .glitch-404::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch-404::before {
            left: 2px;
            text-shadow: -2px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch-404::after {
            left: -2px;
            text-shadow: -2px 0 #00fff9;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(33px, 9999px, 11px, 0); }
            20% { clip: rect(87px, 9999px, 96px, 0); }
            40% { clip: rect(10px, 9999px, 63px, 0); }
            60% { clip: rect(55px, 9999px, 8px, 0); }
            80% { clip: rect(2px, 9999px, 34px, 0); }
            100% { clip: rect(68px, 9999px, 16px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(22px, 9999px, 41px, 0); }
            20% { clip: rect(54px, 9999px, 21px, 0); }
            40% { clip: rect(89px, 9999px, 12px, 0); }
            60% { clip: rect(12px, 9999px, 76px, 0); }
            80% { clip: rect(43px, 9999px, 54px, 0); }
            100% { clip: rect(29px, 9999px, 99px, 0); }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen relative font-rajdhani">

    <div class="absolute top-6 right-6 z-50">
        <button onclick="toggleLanguage()" class="flex items-center gap-2 text-white hover:text-green-400 transition-colors px-3 py-2 border border-white/20 rounded-full hover:border-green-400 bg-black/50 backdrop-blur-sm">
            <i data-lucide="globe" class="w-4 h-4"></i>
            <span id="lang-display" class="font-bold font-mono text-xs">EN</span>
        </button>
    </div>

    <div class="bg-noise"></div>

    <div class="text-center relative z-10 p-4">
        <div class="flex justify-center mb-6 text-green-500 animate-pulse">
            <i data-lucide="triangle-alert" class="w-20 h-20"></i>
        </div>

        <h1 class="text-9xl font-black font-orbitron text-white mb-4 glitch-404" data-text="404">
            404
        </h1>

        <h2 class="text-3xl md:text-4xl font-bold text-green-500 mb-6 font-orbitron tracking-widest"
            data-lang-key="404_title"
            data-en="SECTOR NOT FOUND"
            data-es="SECTOR NO ENCONTRADO">
            SECTOR NOT FOUND
        </h2>

        <p class="text-gray-400 max-w-md mx-auto mb-10 text-lg"
           data-lang-key="404_desc"
           data-en="The signal has been lost in the void. The page you are looking for has been deleted, moved, or never existed in this dimension."
           data-es="La señal se ha perdido en el vacío. La página que buscas ha sido eliminada, movida o nunca existió en esta dimensión.">
            The signal has been lost in the void. The page you are looking for has been deleted, moved, or never existed in this dimension.
        </p>

        <a href="/" class="inline-flex items-center gap-2 px-8 py-4 bg-green-600 hover:bg-green-500 text-black font-bold rounded-lg transition-transform hover:scale-105 group">
            <i data-lucide="arrow-left" class="group-hover:-translate-x-1 transition-transform"></i>
            <span data-lang-key="404_btn" data-en="RETURN TO BASE" data-es="VOLVER A LA BASE">RETURN TO BASE</span>
        </a>
    </div>

    <div class="absolute bottom-8 text-gray-600 text-xs font-mono">
        SYSTEM_ERROR_CODE: 0x0000DEAD
    </div>

    <script>
        lucide.createIcons();

        // ESTADO DE IDIOMA (Por defecto Inglés 'en')
        let currentLang = 'en';

        // SISTEMA DE TRADUCCIÓN SIMPLIFICADO
        function toggleLanguage() {
            // Alternar idioma
            currentLang = currentLang === 'en' ? 'es' : 'en';
            
            // 1. Actualizar indicador del botón (ES / EN)
            const langDisplay = document.getElementById('lang-display');
            langDisplay.innerText = currentLang.toUpperCase();

            // 2. Traducir textos
            const textElements = document.querySelectorAll('[data-lang-key]');
            textElements.forEach(el => {
                const translation = el.getAttribute(`data-${currentLang}`);
                if (translation) {
                    el.innerText = translation;
                }
            });
        }
    </script>
</body>
</html>
